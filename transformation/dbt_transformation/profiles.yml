project_zero_dbt_transformation:
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_FILE_PATH') }}/dev.duckdb"
      threads: 1
      extensions:
        - spatial
        - httpfs
        - iceberg
      secrets: &seaweedfs_secrets
        - type: s3
          key_id: "{{ env_var('DUCKDB_S3_ACCESS_KEY') }}"
          secret: "{{ env_var('DUCKDB_S3_SECRET_KEY') }}"
          endpoint: "{{ env_var('S3_ENDPOINT') }}"
          region: "{{ env_var('AWS_REGION') }}"
          url_style: path
          use_ssl: false
        - type: iceberg
          name: polaris
          client_id: "{{ env_var('POLARIS_PRINCIPAL_CLIENT_ID') }}"
          client_secret: "{{ env_var('POLARIS_PRINCIPAL_CLIENT_SECRET') }}"
          oauth2_server_uri: "{{ env_var('POLARIS_ENDPOINT_URL') }}/api/catalog/v1/oauth/tokens"
          oauth2_scope: PRINCIPAL_ROLE:ALL
      attach: &polaris_attach
        - path: "{{ env_var('POLARIS_CATALOG') }}"
          alias: usgs_catalog
          type: iceberg
          options:
            endpoint: "{{ env_var('POLARIS_ENDPOINT_URL') }}/api/catalog"
            secret: polaris
            access_delegation_mode: none

    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_FILE_PATH') }}/warehouse.duckdb"
      threads: 4
      extensions:
        - spatial
        - httpfs
        - iceberg
      secrets: *seaweedfs_secrets
      attach: *polaris_attach

  target: "{{ env_var('TARGET_ENV', 'dev') }}"
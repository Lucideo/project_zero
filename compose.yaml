services:
  ingestion:
    profiles: [ingestion]
    image: project_zero/ingestion:dev
    build: ./ingestion
    environment:
      LOAD_MODE: ${LOAD_MODE:-incremental}
      DESTINATION_BUCKET: ${DESTINATION_BUCKET}
    volumes:
      - raw_data:/docker_app/raw_data
  transformation:
    profiles: [transformation]
    image: project_zero/transformation:dev
    build: ./transformation
    environment:
      TARGET_ENV: ${TARGET_ENV:-dev}
      DESTINATION_PATH: ${DESTINATION_PATH}
      SOURCE_DATA_DIR: ${SOURCE_DATA_DIR}
      DBT_LOG_PATH: ${DBT_LOG_PATH}
      DBT_TARGET_PATH: ${DBT_TARGET_PATH}
      STATIC_DATA_PATH: ${STATIC_DATA_PATH}
    volumes:
      - raw_data:${SOURCE_DATA_DIR}
      - processed_data:${DESTINATION_PATH}
      - ./data/dbt_data_dump:${DBT_DUMP_PATH}
      - ./data/static_data:${STATIC_DATA_PATH}

volumes:
  raw_data:
    name: raw_data
  processed_data:
    name: processed_data
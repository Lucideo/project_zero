services:
  ingestion:
    image: project_zero/ingestion:dev
    build: ./ingestion
    environment:
      LOAD_MODE: ${LOAD_MODE:-incremental}
      DESTINATION_BUCKET: ${DESTINATION_BUCKET:-/docker_app/raw_data}
    volumes:
      - raw_data:/docker_app/raw_data
  transformation:
    image: project_zero/transformation:dev
    build: ./transformation
    environment:
      TARGET_ENV: ${TARGET_ENV:-dev}
      DESTINATION_PATH: ${DESTINATION_PATH:-/docker_app/data/processed_data}
      SOURCE_DATA_DIR: ${SOURCE_DATA_DIR:-/docker_app/data/raw_data}
      DBT_LOG_PATH: ${DBT_LOG_PATH:-/docker_app/data/dbt_data_dump/logs}
      DBT_TARGET_PATH: ${DBT_TARGET_PATH:-/docker_app/data/dbt_data_dump/target}
      STATIC_DATA_PATH: ${STATIC_DATA_PATH:-/docker_app/data/static_data}
    volumes:
      - raw_data:/docker_app/data/raw_data
      - processed_data:/docker_app/data/processed_data
      - ./data/dbt_data_dump:/docker_app/data/dbt_data_dump
      - ./data/static_data:/docker_app/data/static_data

volumes:
  raw_data:
    name: raw_data
  processed_data:
    name: processed_data
include:
  - infra_seaweed_polaris/compose_seaweed_polaris.yaml
  
services:
  ingestion:
    profiles: [ingestion]
    image: project_zero/ingestion:dev
    networks: [project-zero]
    build: ./ingestion
    environment:
      LOAD_MODE: ${LOAD_MODE:-incremental}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_CONTAINER}
      DLT_S3_ACCESS_KEY: ${DLT_S3_ACCESS_KEY}
      DLT_S3_SECRET_KEY: ${DLT_S3_SECRET_KEY}
  transformation:
    profiles: [transformation]
    image: project_zero/transformation:dev
    networks: [project-zero]
    build: ./transformation
    environment:
      TARGET_ENV: ${TARGET_ENV:-dev}
      DESTINATION_PATH: ${DESTINATION_PATH}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT_CONTAINER}
      AWS_REGION: ${AWS_REGION}
      DUCKDB_S3_ACCESS_KEY: ${DUCKDB_S3_ACCESS_KEY}
      DUCKDB_S3_SECRET_KEY: ${DUCKDB_S3_SECRET_KEY}
      DBT_LOG_PATH: ${DBT_LOG_PATH}
      DBT_TARGET_PATH: ${DBT_TARGET_PATH}
      STATIC_DATA_PATH: ${STATIC_DATA_PATH}
    volumes:
      - processed_data:${DESTINATION_PATH}
      - ./data/dbt_data_dump:${DBT_DUMP_PATH}
      - ./data/static_data:${STATIC_DATA_PATH}

volumes:
  processed_data:
    name: processed_data